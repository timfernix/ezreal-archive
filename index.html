<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ezreal Media Archive - A collection of all official Ezreal media from League of Legends">
    <meta name="keywords" content="Ezreal, League of Legends, Skins, Archive, Media">
    <meta name="author" content="timfernix">
    <meta name="theme-color" content="#122730">
    <meta property="og:title" content="Ezreal Media Archive">
    <meta property="og:description" content="Browse and explore all official Ezreal media content">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ezreal.timfernix.dev/" />
    <meta property="og:image" content="https://assets.timfernix.dev/archive_v3.png" />
    <meta property="og:image:alt" content="Ezreal Media Archive preview image" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ezreal Media Archive" />
    <meta name="twitter:description" content="Browse and explore all official Ezreal media content" />
    <meta name="twitter:image" content="https://assets.timfernix.dev/archive_v3.png" />
    <meta name="twitter:image:alt" content="Ezreal Media Archive preview image" />
    <link rel="icon" href="https://assets.timfernix.dev/base/Base_Ezreal_Current_Icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="https://assets.timfernix.dev/base/Base_Ezreal_Current_Icon.png" />
    <title>Ezreal Media Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="glass-nav">
        <div class="masthead">
            <div class="masthead-art" aria-hidden="true"></div>
            <div class="masthead-rule" aria-hidden="true"></div>
        </div>
        <div class="nav-content">
            <div class="brand-block">
                <h1 class="brand-name">Ezreal <span>Media Archive</span></h1>
                <p class="brand-subline">by <a href="https://timfernix.dev" target="_blank" rel="noopener noreferrer">timfernix</a></p>
            </div>
        </div>
        <div class="filter-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search skins, titles, descriptions..." autocomplete="off">
            </div>
            <button id="mobile-filter-toggle" class="mobile-filter-toggle" type="button" aria-expanded="false" aria-controls="filter-controls">
                Filters
            </button>
            <div id="filter-controls" class="filter-controls">
                <div class="filter-group">
                    <button class="filter-toggle" data-target="skinline-menu">Skinlines ▾</button>
                    <div id="skinline-menu" class="dropdown-menu"></div>
                </div>
                <div class="filter-group">
                    <button class="filter-toggle" data-target="cat-menu">Categories ▾</button>
                    <div id="cat-menu" class="dropdown-menu"></div>
                </div>
                <div class="filter-group">
                    <button class="filter-toggle" data-target="game-menu">Games ▾</button>
                    <div id="game-menu" class="dropdown-menu"></div>
                </div>
                <div class="filter-group">
                    <button class="filter-toggle" data-target="tag-menu">Tags ▾</button>
                    <div id="tag-menu" class="dropdown-menu"></div>
                </div>
                <div class="filter-group">
                    <select id="sortSelect" class="sort-select">
                        <option value="newest" selected>Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="skinline-asc">Skinline (A-Z)</option>
                    </select>
                </div>
                <button id="clear-filters-btn" type="button" class="clear-filters-btn">Reset</button>
            </div>
            <p id="archive-meta" class="archive-meta" aria-live="polite">
                <span id="archive-meta-text">Last synced: - | Total items: -</span>
                <span id="archive-meta-spinner" class="mini-spinner hidden" aria-hidden="true"></span>
            </p>
        </div>
    </nav>

<main class="gallery-wrapper">
        <div id="loading" class="state-message">Syncing archive...</div>
        <div id="no-results" class="state-message hidden">No media found for these filters.</div>
        
        <div id="gallery-container" class="grid-layout"></div>
        <div id="pagination-controls" class="pagination-controls hidden">
            <button id="load-more-btn" type="button" class="load-more-btn">Load 50 more</button>
            <p id="pagination-status" class="pagination-status hidden" aria-live="polite"></p>
        </div>
        <div id="auto-load-sentinel" aria-hidden="true"></div>
    </main>

    <div id="lightbox" class="lightbox hidden">
        <span class="close-btn">&times;</span>
        <div class="lightbox-content">
            <div class="lightbox-media">
                <img id="lightbox-img" src="" alt="Full view">
            </div>
            <div class="lightbox-info">
                <h2 id="lightbox-title" class="lightbox-title"></h2>
                <div id="lightbox-details" class="lightbox-details"></div>
                <div id="lightbox-tags" class="lightbox-tags-container"></div>
                <details class="lightbox-technical-details">
                    <summary>Technical information</summary>
                    <div id="lightbox-technical" class="lightbox-technical"></div>
                </details>
                <div class="lightbox-actions">
                    <a id="original-link" href="" target="_blank" class="view-original-btn">Open Original File</a>
                    <button id="share-asset-link" type="button" class="share-asset-btn">Share Asset</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="script.js?v=database-id" type="module"></script>
</body>
</html>
